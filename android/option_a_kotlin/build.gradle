// Top-level build file — uses local JAR files for Chaquopy to bypass Maven resolution issues
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
        classpath files('libs/gradle-11.0.0.jar')
        classpath files('libs/commons-compress-1.18.jar')
        classpath files('libs/json-20160810.jar')
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.22'
    }
}
