plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Los scripts Python viven una sola vez en la raíz del repo (lib/, core/, cli/).
// Se copian a los assets del APK en tiempo de build para no duplicar el árbol
// completo dentro de android/app/src/main/assets.
ext.pythonSourceRoot = file("$rootDir/..")
ext.pythonAssetsDir = file("$buildDir/generated/pythonAssets")
ext.pythonAssetDirs = ['lib', 'core', 'cli']

def syncPythonAssets = tasks.register('syncPythonAssets', Sync) {
    description = 'Copia lib/, core/ y cli/ del repo a los assets del APK.'
    into new File(pythonAssetsDir, 'python')
    pythonAssetDirs.each { dir ->
        from(new File(pythonSourceRoot, dir)) {
            into dir
            include '**/*.py'
        }
    }
}

android {
    namespace = "com.ps4cheater"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.ps4cheater"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    sourceSets {
        main { assets.srcDirs += pythonAssetsDir }
    }

    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion = "1.5.3" }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach {
    dependsOn syncPythonAssets
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'

    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.webkit:webkit:1.8.0'
}
