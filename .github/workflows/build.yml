name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Generate Gradle wrapper
        working-directory: android/option_a_kotlin
        run: gradle wrapper --gradle-version 7.5 --distribution-type bin

      - name: Test minimal Chaquopy build (diagnostic)
        working-directory: android/test_minimal
        run: |
          gradle wrapper --gradle-version 7.5 --distribution-type bin
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Build debug APK (Option A)
        working-directory: android/option_a_kotlin
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List built APK
        run: |
          find android/option_a_kotlin/app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4cheater-debug-apk
          path: android/option_a_kotlin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/option_a_kotlin/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
