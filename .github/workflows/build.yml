name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5.1'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT/platforms/ | head -5
          ls -la $ANDROID_SDK_ROOT/build-tools/ | head -5

      - name: Generate Gradle wrapper
        working-directory: android/option_a_kotlin
        run: gradle wrapper --gradle-version 7.5.1 --distribution-type bin

      - name: Diagnose Chaquopy plugin
        working-directory: android/option_a_kotlin
        run: |
          cat > /tmp/test_chaquopy.gradle << 'GROOVY'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://chaquo.com/maven' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath 'com.chaquo.python:gradle:12.0.0'
              }
          }
          apply plugin: 'com.android.application'
          apply plugin: 'com.chaquo.python'
          println "=== DIAGNOSTIC: Applied plugins ==="
          project.plugins.each { println "  Plugin: ${it.class.name}" }
          println "=== DIAGNOSTIC: Extensions ==="
          project.extensions.extensionsSchema.each { println "  Extension: ${it.key} -> ${it.value.publicType.name}" }
          println "=== DIAGNOSTIC: has chaquopy method: " + project.metaClass.respondsTo(project, 'chaquopy') + " ==="
          GROOVY
          ./gradlew --no-daemon -q --init-script /tmp/test_chaquopy.gradle help 2>&1 | grep -A2 "DIAGNOSTIC\|chaquopy\|Extension:\|Plugin:" || true

      - name: Build debug APK
        working-directory: android/option_a_kotlin
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List built APK
        run: |
          find android/option_a_kotlin/app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4cheater-debug-apk
          path: android/option_a_kotlin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/option_a_kotlin/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
